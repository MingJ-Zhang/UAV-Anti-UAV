# SUTrack-B224 + SLA-v3 (research-grounded) for UAV-Anti-UAV.
# Identity-grounded localization: ISIA -> LSC -> SGCR.

DATA:
  MAX_SAMPLE_INTERVAL: 400
  SAMPLER_MODE: order
  MULTI_MODAL_LANGUAGE: True
  MULTI_MODAL_VISION: True
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 224
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 112
    NUMBER: 2
  TRAIN:
    DATASETS_NAME: [UAVANTIUAV]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 20000
  USE_NLP:
    UAVANTIUAV: True
    UAVANTI: True
    UAVANTI_VL: True
    TNL2K: True

MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: pretrained/fast_itpn_base_clipl_e1600.pt
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    TOKEN_TYPE_INDICATE: True
  TEXT_ENCODER:
    TYPE: ViT-L/14
  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: True
  TASK_DECODER:
    NUM_CHANNELS: 256
    FEATURE_TYPE: average
  TASK_NUM: 5
  TASK_INDEX:
    VASTTRACK: 0
    LASOT: 0
    TRACKINGNET: 0
    GOT10K: 0
    COCO: 0
    TNL2K: 1
    DEPTHTRACK: 2
    LASHER: 3
    VISEVENT: 4
    UAVANTIUAV: 1
    UAVANTI: 1
    UAVANTI_VL: 1
    A2ATRACKING: 1
    DUTANTIUAV: 1
  SLA_V3:
    ENABLED: True
    HIDDEN_DIM: 128
    IDENTITY_TEMPERATURE: 0.10
    ISIA_HEADS: 4
    LSC_TEMPERATURE: 0.15
    LSC_RESIDUAL_SCALE: 0.10
    LSC_GATE_MAX: 4.0
    SGCR_HIDDEN_DIM: 128
    SGCR_TOPK: 5
    SGCR_DISTRACTOR_IOU: 0.30
    SGCR_BOX_DELTA_SCALE: 0.20
    DROPOUT: 0.0

TRAIN:
  TYPE: text_frozen
  PRETRAINED_PATH: pretrained/SUTRACK_ep0180.pth.tar
  ALLOW_PARTIAL_PRETRAIN: False
  ENCODER_MULTIPLIER: 0.1
  BATCH_SIZE: 16
  EPOCH: 40
  GRAD_CLIP_NORM: 0.1
  LR: 0.00005
  LR_DROP_EPOCH: 30
  NUM_WORKER: 4
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  CE_WEIGHT: 1.0
  TASK_CE_WEIGHT: 1.0

  # Dense semantic-localization supervision.
  SEM_LOC_WEIGHT: 0.05
  SEM_LOC_TEMPERATURE: 0.10
  SEM_LOC_DETACH_TEXT: True
  SEM_LOC_NORMALIZE_LOGN: True

  # Identity and candidate-resolution objectives.
  IDENTITY_LOC_WEIGHT: 0.03
  ANCHOR_CONTRAST_WEIGHT: 0.02
  ANCHOR_CONTRAST_MARGIN: 0.10
  CAND_CLS_WEIGHT: 0.10
  CAND_BOX_WEIGHT: 0.10
  CAND_QUALITY_TEMPERATURE: 0.20
  CAND_MIN_ORACLE_IOU: 0.05

  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001

TEST:
  EPOCH: 40
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  WINDOW: True
  NUM_TEMPLATES: 2
  UPDATE_INTERVALS:
    DEFAULT: 25
    UAVANTI: 25
    UAVANTIUAV: 25
  UPDATE_THRESHOLD:
    DEFAULT: 0.70
    UAVANTI: 0.70
    UAVANTIUAV: 0.70
  MULTI_MODAL_VISION:
    DEFAULT: True
    UAVANTI: True
    UAVANTIUAV: True
  MULTI_MODAL_LANGUAGE:
    DEFAULT: True
    UAVANTI: True
    UAVANTIUAV: True
  USE_NLP:
    DEFAULT: False
    TNL2K: True
    UAVANTI: True
    UAVANTIUAV: True
    A2ATRACKING: True
    DUTANTIUAV: True
