name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.24,<2' PyYAML
      - name: Compile Python sources
        run: python -m compileall -q lib tracking tools tests
      - name: Check identity, calibration, candidate resolution and gradients
        run: python tools/sla_v3_unit_test.py
      - name: Test setup, launchers and evaluation protocol
        run: python -m unittest discover -s tests -v
